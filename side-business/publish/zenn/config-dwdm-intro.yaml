title: "DWDM とは何か — 光伝送に配属された人の最初の一冊"
summary: "「DWDM」の意味が曖昧なまま光伝送の担当になった人と、客先で話についていきたい営業・技術営業の方へ。各章は専門用語ゼロのたとえ話から始まります。1本のファイバに複数の波長を載せる仕組み、dB と dBm、伝送を制限する4つの要因、装置それぞれの役割、そして「400G」という同じ名前から別のものを想像してしまう現場の事故まで。読み終えたとき、その話題の会話が聞き取れて、人に説明できる状態を目指します。"
